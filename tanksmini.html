const BOSSES=Array.of(
  {id:'p1000',n:'P.1000 Ratte',hp:5200,bhp:22000,d:650,bd:820,s:.46,r:280,ar:.95,t:1,db:1,c:'#5d666e',c2:'#2c3238',c3:'#8c98a3',w:84,h:50,bl:46,bo:4},
  {id:'p1500',n:'P.1500 Monster',hp:5600,bhp:26000,d:1150,bd:1550,s:.40,r:440,ar:.92,t:0,c:'#6b6457',c2:'#36322b',c3:'#968c7a',w:92,h:54,bl:44,bo:8},

);
let sel=T.at(0),mode='sup',bIdx=0,map='let',perk='hp',he=0;
let unlocked=JSON.parse(localStorage.getItem('bosses')||'[]');
let W,H,MW=1750,MH=1250,Z=.64,x=c.getContext('2d'),u=[],b=[],w=[],pt=[],tr=[],ft=[],bs=[],pts=Array.of(0,0),jx=0,jy=0,run=0;
function getPool(){return T.concat(BOSSES.filter(o=>unlocked.includes(o.id)));}
function dm(){
  let pool=getPool();if(!pool.includes(sel))sel=pool.at(0);
  modes.innerHTML=`<button class="opt ${mode=='sup'?'on':''}" onclick="mode='sup';dm()">Превосх. 5x5</button>`+BOSSES.map((o,i)=>`<button class="opt ${mode=='boss'&&bIdx==i?'on':''}" onclick="mode='boss';bIdx=${i};dm()">Босс: ${o.n.split(' ').at(0)}</button>`).join('');
  maps.innerHTML=`<button class="opt ${map=='let'?'on':''}" onclick="map='let';dm()">Карта: Лес</button><button class="opt ${map=='zim'?'on':''}" onclick="map='zim';dm()">Зима</button><button class="opt ${map=='pus'?'on':''}" onclick="map='pus';dm()">Пустыня</button>`;
  perks.innerHTML=`<button class="opt ${perk=='hp'?'on':''}" onclick="perk='hp';dm()">+25% HP</button><button class="opt ${perk=='ad'?'on':''}" onclick="perk='ad';dm()">Адреналин</button><button class="opt ${perk=='sp'?'on':''}" onclick="perk='sp';dm()">Турбо</button><button class="opt ${perk=='ar'?'on':''}" onclick="perk='ar';dm()">Рикошет-броня</button>`;
  list.innerHTML=pool.map((t,i)=>`<div class="card ${t.bhp?'boss':''} ${t==sel?'on':''}" onclick="sel=getPool().at(${i});dm()">${t.n}</div>`).join('');
  let g=sel.cl?`Барабан ${sel.cl}x${sel.d}`:(sel.db?`Дуплет ${sel.d}x2`:`Урон: ${sel.d}`);
  info.textContent=`HP: ${sel.hp} | ${g} | Броня: ${Math.round(sel.ar*100)}%`;
}dm();
go.onclick=()=>{
  menu.style.display='none';W=c.width=innerWidth;H=c.height=innerHeight;he=0;ammo.textContent='Снаряд: ББ';ammo.style.background='#2980b9';
  w=Array.of(
    {x:310,y:210,w:48,h:180},{x:310,y:860,w:48,h:180},
    {x:540,y:340,w:140,h:42},{x:540,y:868,w:140,h:42},
    {x:770,y:460,w:210,h:38},{x:770,y:752,w:210,h:38},
    {x:1070,y:340,w:140,h:42},{x:1070,y:868,w:140,h:42},
    {x:1390,y:210,w:48,h:180},{x:1390,y:860,w:48,h:180}
  );
  bs=mode=='sup'?Array.of({n:'A',x:875,y:220,o:0,pr:0},{n:'B',x:660,y:625,o:0,pr:0},{n:'C',x:1090,y:625,o:0,pr:0},{n:'D',x:875,y:1030,o:0,pr:0}):Array.of();
  pts=Array.of(0,0);
  let pSpec={...sel,x:110,y:625,a:0,ta:0,cd:0,am:sel.cl||1,tm:1,p:1};
  if(perk=='hp')pSpec.hp=Math.round(pSpec.hp*1.25);
  if(perk=='ad'){pSpec.r=Math.round(pSpec.r*.75);if(pSpec.ir)pSpec.ir=Math.round(pSpec.ir*.75);}
  if(perk=='sp')pSpec.s*=1.25;
  if(perk=='ar')pSpec.ar=Math.min(1.25,pSpec.ar+.35);
  pSpec.m=pSpec.hp;u=Array.of(pSpec);
  if(mode=='boss'){
    let bsObj=BOSSES.at(bIdx);
    for(let i=0;i<9;i++){let r=T.at(Math.random()*T.length|0);u.push({...r,x:130+(i%2)*60,y:130+i*120,m:r.hp,a:0,ta:0,cd:0,am:r.cl||1,tm:1,p:0,st:0,sd:1});}
    u.push({...bsObj,hp:bsObj.bhp,m:bsObj.bhp,d:bsObj.bd,x:MW-180,y:625,a:3.14,ta:3.14,cd:0,am:bsObj.cl||1,tm:0,p:0,st:0,sd:1});
  }else{
    for(let i=0;i<4;i++){let r=T.at(Math.random()*T.length|0);u.push({...r,x:130,y:170+(i+(i>1?1:0))*225,m:r.hp,a:0,ta:0,cd:0,am:r.cl||1,tm:1,p:0,st:0,sd:1});}
    for(let i=0;i<5;i++){let r=T.at(Math.random()*T.length|0);u.push({...r,x:MW-130,y:170+i*225,m:r.hp,a:3.14,ta:3.14,cd:0,am:r.cl||1,tm:0,p:0,st:0,sd:1});}
  }
  pt=[];tr=[];ft=[];run=1;loop();

ammo.ontouchstart=ammo.onclick=e=>{e.preventDefault();he=1-he;ammo.textContent=he?'Снаряд: ОФ':'Снаряд: ББ';ammo.style.background=he?'#d35400':'#2980b9';};
function mj(e){let t=e.targetTouches.item(0);if(!t)return;let r=joy.getBoundingClientRect(),dx=t.clientX-(r.left+55),dy=t.clientY-(r.top+55),d=Math.hypot(dx,dy);if(d>35){dx=dx/d*35;dy=dy/d*35;}stick.style.transform=`translate(${dx}px,${dy}px)`;jx=dx/35;jy=dy/35;}
joy.ontouchstart=joy.ontouchmove=mj;joy.ontouchend=()=>{jx=jy=0;stick.style.transform='';};
fire.ontouchstart=e=>{e.preventDefault();sh(u.at(0));};fire.onmousedown=()=>sh(u.at(0));
function sh(t){if(!t||t.hp<=0||t.cd>0)return;if(t.cl){t.am--;if(t.am>0)t.cd=t.ir;else{t.cd=t.r;t.am=t.cl;}}else t.cd=t.r;let isHe=t.p?he:0,bx=t.x+Math.cos(t.a)*t.bo,by=t.y+Math.sin(t.a)*t.bo,offs=t.db?Array.of(-t.h*.2,t.h*.2):Array.of(0);offs.forEach(o=>{let px=-Math.sin(t.ta)*o,py=Math.cos(t.ta)*o,mx=bx+px+Math.cos(t.ta)*t.bl,my=by+py+Math.sin(t.ta)*t.bl;b.push({x:mx,y:my,vx:Math.cos(t.ta)*4.6,vy:Math.sin(t.ta)*4.6,d:t.d,tm:t.tm,he:isHe,rc:0});for(let k=0;k<7;k++)pt.push({x:mx,y:my,vx:(Math.random()-.5)*4+Math.cos(t.ta)*2,vy:(Math.random()-.5)*4+Math.sin(t.ta)*2,l:16,c:isHe?'#e67e22':'#f39c12',r:k<4?5:7});});}
function hit(px,py,r=18){if(px<r||px>MW-r||py<r||py>MH-r)return 1;return w.some(o=>px+r>o.x&&px-r<o.x+o.w&&py+r>o.y&&py-r<o.y+o.h);}
function clearLine(x1,y1,x2,y2){let d=Math.hypot(x2-x1,y2-y1),st=Math.ceil(d/16);for(let i=1;i<st;i++)if(hit(x1+(x2-x1)*i/st,y1+(y2-y1)*i/st,6))return 0;return 1;}
function dt(t){
  let c1=t.tm?t.c:'#99323d',c2=t.tm?t.c2:'#4d141a',c3=t.tm?t.c3:'#c75460',hw=t.w/2,hh=t.h/2;
  x.save();x.translate(t.x,t.y);
  x.fillStyle=t.p?'#f1c40f':(t.bhp?'#ff7675':'#fff');x.font='bold 12px sans-serif';x.textAlign='center';x.fillText(t.n,0,-hh-18);
  let bw=t.bhp?76:46;x.fillStyle='rgba(0,0,0,.75)';x.fillRect(-bw/2,-hh-14,bw,6);x.fillStyle=t.tm?'#2ecc71':'#e74c3c';x.fillRect(-bw/2+1,-hh-13,(bw-2)*(t.hp/t.m),4);
  x.rotate(t.a);
  x.fillStyle='rgba(0,0,0,.48)';x.beginPath();x.roundRect(-hw+4,-hh-1,t.w+2,t.h+10,4);x.fill();
  x.fillStyle='#181a1c';x.fillRect(-hw,-hh-4,t.w,t.h+8);
  x.fillStyle='#3b3f45';for(let gx=-hw+2;gx<hw-2;gx+=4){x.fillRect(gx,-hh-4,2,3);x.fillRect(gx,hh+1,2,3);}
  let gr=x.createLinearGradient(0,-hh,0,hh);gr.addColorStop(0,c3);gr.addColorStop(.35,c1);gr.addColorStop(1,c2);
  x.fillStyle=gr;x.strokeStyle='#111';x.lineWidth=1.5;
  if(t.id=='is4'||t.id=='is7'||t.id=='st2'){
    x.beginPath();x.moveTo(-hw,-hh);x.lineTo(hw-11,-hh);x.lineTo(hw,0);x.lineTo(hw-11,hh);x.lineTo(-hw,hh);x.closePath();x.fill();x.stroke();
  }else if(t.id=='e3'||t.id=='e4'||t.id=='e5'||t.id=='t57'){
    x.beginPath();x.moveTo(-hw,-hh);x.lineTo(hw-7,-hh);x.quadraticCurveTo(hw+4,0,hw-7,hh);x.lineTo(-hw,hh);x.closePath();x.fill();x.stroke();
  }else{x.beginPath();x.roundRect(-hw,-hh,t.w,t.h,2);x.fill();x.stroke();}
  x.fillStyle=c2;x.fillRect(-hw+4,-hh+4,12,t.h-8);
  if(t.id=='jaga'||t.id=='v4'||t.id=='sturm'||t.id=='p1500'){let rx=(t.id=='jaga'||t.id=='sturm')?-hw+1:-10;x.fillStyle=gr;x.beginPath();x.roundRect(rx,-hh+3,t.bhp?44:24,t.h-6,3);x.fill();x.stroke();}
  if(t.id=='e3'){x.fillStyle=gr;x.beginPath();x.arc(2,0,12,0,7);x.fill();x.stroke();}
  if(t.id=='kv6'){x.fillStyle=c2;x.fillRect(-28,-14,16,28);x.strokeRect(-28,-14,16,28);x.fillRect(22,-11,14,22);x.strokeRect(22,-11,14,22);}
  x.restore();x.save();x.translate(t.x+Math.cos(t.a)*t.bo,t.y+Math.sin(t.a)*t.bo);x.rotate(t.ta);
  x.fillStyle='#222';
  if(t.db){let off=t.h*.2;x.fillRect(0,-off-2.5,t.bl,5);x.fillRect(0,off-2.5,t.bl,5);}
  else if(t.id=='sturm'||t.id=='p1500'){x.fillRect(0,-7,t.bl,14);x.strokeRect(0,-7,t.bl,14);}
  else{x.fillRect(0,-2.6,t.bl,5.2);if(t.id!='maus')x.fillRect(t.bl-5,-4.2,6,8.4);}
  if(t.t){
    let tg=x.createRadialGradient(-3,-4,2,0,0,t.bhp?26:16);tg.addColorStop(0,c3);tg.addColorStop(.6,c1);tg.addColorStop(1,c2);
    x.fillStyle=tg;x.strokeStyle='#111';x.lineWidth=1.5;
    if(t.bhp){x.beginPath();x.roundRect(-24,-18,44,36,4);x.fill();x.stroke();}
    else if(t.id=='maus'||t.id=='m2'||t.id=='fv'){x.beginPath();x.roundRect(-15,-12,26,24,3);x.fill();x.stroke();}
    else if(t.id=='e100'||t.id=='tmaus'){x.beginPath();x.moveTo(-15,-12);x.lineTo(11,-9);x.lineTo(11,9);x.lineTo(-15,12);x.closePath();x.fill();x.stroke();}
    else if(t.id=='gril'||t.id=='wt'){x.fillStyle=c2;x.fillRect(-11,-10,20,20);x.strokeRect(-11,-10,20,20);}
    else if(t.id=='vk'){x.beginPath();x.arc(0,0,11.5,0,7);x.fill();x.stroke();}
    else{x.beginPath();x.ellipse(0,0,13.5,10,0,0,7);x.fill();x.stroke();}
    x.fillStyle=c2;x.beginPath();x.arc(-3,-3.5,3.5,0,7);x.fill();x.stroke();
  }
  x.restore();
}
function loop(){
  if(!run)return;let p=u.at(0);
  if(p.hp>0){
    if(Math.hypot(jx,jy)>.1){p.a=Math.atan2(jy,jx);let nx=p.x+Math.cos(p.a)*p.s,ny=p.y+Math.sin(p.a)*p.s;if(!hit(nx,p.y,p.h/2+2))p.x=nx;if(!hit(p.x,ny,p.h/2+2))p.y=ny;if(Math.random()<.35)tr.push({x:p.x,y:p.y,a:p.a,h:p.h,l:140});}

  b=b.filter(o=>{
    o.x+=o.vx;o.y+=o.vy;

      let sa=Math.atan2(o.vy,o.vx),diff=Math.abs(Math.sin(sa-t.a));

        let na=t.a+(Math.cos(sa-t.a)>0?0.3:-0.3),sp=Math.hypot(o.vx,o.vy)*.8;o.vx=Math.cos(na)*sp;o.vy=Math.sin(na)*sp;o.rc=1;
        ft.push({x:t.x,y:t.y-25,txt:'РИКОШЕТ!',c:'#3498db',l:45});return 1;
      }

      for(let k=0;k<10;k++)pt.push({x:o.x,y:o.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:20,c:o.he?'#f39c12':'#e74c3c',r:o.he?7:5});

  });
  tr=tr.filter(o=>--o.l>0);pt=pt.filter(o=>{o.x+=o.vx;o.y+=o.vy;return --o.l>0;});ft=ft.filter(o=>{o.y-=.5;return --o.l>0;});
  let al=u.filter(t=>t.tm&&t.hp>0).length,en=u.filter(t=>!t.tm&&t.hp>0).length,clTxt=p.cl?` [${p.am}/${p.cl}]`:'',pct=Math.max(0,p.hp)/p.m;
  hp.innerHTML=`${p.n}${clTxt} ${p.cd>0?'<b style="color:#f39c12">КД '+(p.cd/60).toFixed(1)+'с</b>':'<b style="color:#2ecc71">ГОТОВ</b>'}`;
  sc.textContent=mode=='sup'?`Счет: ${al}:${en} | База: ${Math.floor(pts.at(0))} : ${Math.floor(pts.at(1))}`:`Союзники: ${al} | Босс: ${en?u.find(t=>!t.tm).hp+' HP':'УБИТ'}`;
  hpfill.style.width=(pct*100)+'%';hpfill.style.background=pct>.5?'linear-gradient(#2ecc71,#27ae60)':(pct>.25?'linear-gradient(#f1c40f,#f39c12)':'linear-gradient(#e74c3c,#c0392b)');hptxt.textContent=`${Math.max(0,p.hp)} / ${p.m} HP`;
  fire.textContent=p.cd>0?(p.cd/60).toFixed(1)+'с':(p.cl?`ОГОНЬ\n(${p.am})`:'ОГОНЬ');fire.style.background=p.cd>0?'#555':'radial-gradient(circle at 30% 30%,#e74c3c,#922b21)';
  let win=mode=='sup'?(en==0||pts.at(0)>=1000):(en==0),lose=mode=='sup'?(p.hp<=0||pts.at(1)>=1000):(al==0);

    else setTimeout(()=>{alert(win?'ПОБЕДА!':'ПОРАЖЕНИЕ!');location.reload();},100);
  }
  let vw=W/Z,vh=H/Z,cx=Math.max(0,Math.min(MW-vw,p.x-vw/2)),cy=Math.max(0,Math.min(MH-vh,p.y-vh/2));

  x.fillStyle=map=='zim'?'rgba(93,109,126,.35)':(map=='pus'?'rgba(125,102,8,.35)':'#5c5442');x.fillRect(0,590,MW,70);x.fillRect(850,0,50,MH);
  bs.forEach(z=>{x.strokeStyle=z.o==1?'#2ecc71':(z.o==-1?'#e74c3c':'#fff');x.lineWidth=4;x.beginPath();x.arc(z.x,z.y,56,0,7);x.stroke();if(z.pr>0){x.strokeStyle='#f1c40f';x.beginPath();x.arc(z.x,z.y,50,-1.57,-1.57+6.28*(z.pr/300));x.stroke();}x.fillStyle='#fff';x.font='bold 20px sans-serif';x.textAlign='center';x.fillText(z.n,z.x,z.y+7);});
  tr.forEach(o=>{x.save();x.translate(o.x,o.y);x.rotate(o.a);x.fillStyle=map=='zim'?'rgba(40,60,80,.25)':'rgba(25,30,20,.25)';x.fillRect(-2,-o.h/2-2,4,3);x.fillRect(-2,o.h/2-1,4,3);x.restore();});
  x.strokeStyle='#c0392b';x.lineWidth=8;x.strokeRect(0,0,MW,MH);
  w.forEach(o=>{x.fillStyle='rgba(0,0,0,.45)';x.fillRect(o.x+8,o.y+8,o.w,o.h);let wg=x.createLinearGradient(o.x,o.y,o.x+o.w,o.y+o.h);if(map=='zim'){wg.addColorStop(0,'#85c1e9');wg.addColorStop(1,'#2e86c1');}else if(map=='pus'){wg.addColorStop(0,'#b9770e');wg.addColorStop(1,'#7e5109');}else{wg.addColorStop(0,'#85929e');wg.addColorStop(1,'#4d5656');}x.fillStyle=wg;x.fillRect(o.x,o.y,o.w,o.h);x.strokeStyle='#1b2631';x.lineWidth=2;x.strokeRect(o.x,o.y,o.w,o.h);});
